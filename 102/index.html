<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="utf-8">
    <title>Allure Report</title>
    <link rel="favicon" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" type="text/css" href="plugin/screen-diff/styles.css">
</head>
<body>
    <div id="alert"></div>
    <div id="content">
        <span class="spinner">
            <span class="spinner__circle"></span>
        </span>
    </div>
    <div id="popup"></div>
    <script src="app.js"></script>
    <script src="plugin/behaviors/index.js"></script>
    <script src="plugin/screen-diff/index.js"></script>
    <script src="plugin/packages/index.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FVWC4GKEYS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FVWC4GKEYS');
        gtag('allureVersion', 'dev')
        gtag('reportUuid', '0754096b-14be-4a9e-af44-4b11f2be0d00')
    </script>

<script>
/* allure-ui-customization:start */
(function () {
  var POSTMAN_URL = 'https://qa-62.postman.co/workspace/ff37cf16-0011-4920-87e2-1e4203967ab5/overview?sideView=agentMode';
  var TESTNG_URL = 'https://github.com/visable-dev/v-china-autotest';
  var VISABLE_ICON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36"><rect x="2" y="18" width="8" height="16" fill="%23eb1f2d"/><rect x="14" y="8" width="8" height="26" fill="%231a4ea1"/><rect x="26" y="2" width="8" height="32" fill="%2369be28"/></svg>';

  function hideModules() {
    var hiddenRoutes = ['#categories', '#graphs', '#timeline', '#behaviors', '#packages'];
    var hiddenNames = ['categories', 'graphs', 'timeline', 'behaviors', 'packages'];
    var links = document.querySelectorAll('a[href]');
    links.forEach(function (a) {
      var href = a.getAttribute('href') || '';
      var text = (a.textContent || '').trim().toLowerCase();
      var routeHit = hiddenRoutes.indexOf(href) >= 0;
      var nameHit = hiddenNames.some(function (name) { return text === name || text.indexOf(name) >= 0; });
      if (!routeHit && !nameHit) return;
      var row = a.closest('li') || a.parentElement;
      if (row) row.style.display = 'none';
    });

    // Fallback for nav items rendered without anchor href.
    var maybeNavItems = document.querySelectorAll('li, div, span, a');
    maybeNavItems.forEach(function (el) {
      var txt = (el.textContent || '').trim().toLowerCase();
      if (!txt) return;
      if (!hiddenNames.some(function (name) { return txt === name; })) return;
      var row = el.closest('li') || el.parentElement;
      if (row) row.style.display = 'none';
    });
  }

  function customizeBrand() {
    var side = document.querySelector('aside, .side-nav, .sidebar');
    if (!side) return;
    var injected = document.getElementById('qa-brand-block');
    if (injected && injected.parentElement) injected.parentElement.removeChild(injected);

    var textCandidates = Array.from(side.querySelectorAll('span, strong, div, a')).filter(function (el) {
      var text = (el.textContent || '').trim();
      return text === 'Allure' || text === 'QA';
    });
    if (!textCandidates.length) return;

    var textNode = textCandidates[0];
    textNode.textContent = 'QA';
    var container = textNode.parentElement;
    if (!container) return;

    Array.from(container.children).forEach(function (child) {
      if (child === textNode) return;
      if (child.tagName === 'IMG' && child.getAttribute('data-visable-logo') === 'true') return;
      if (child.tagName === 'IMG' || child.tagName === 'SVG' || child.tagName === 'I') {
        child.style.display = 'none';
      }
    });

    var img = container.querySelector('img[data-visable-logo="true"]');
    if (!img) {
      img = document.createElement('img');
      img.setAttribute('data-visable-logo', 'true');
      img.src = 'data:image/svg+xml;utf8,' + VISABLE_ICON_SVG;
      img.alt = 'visable';
      img.style.width = '34px';
      img.style.height = '34px';
      img.style.objectFit = 'contain';
      img.style.marginRight = '10px';
      container.insertBefore(img, textNode);
    }
  }

  function replaceOverviewTitle() {
    // Only touch likely heading nodes to avoid flattening container DOM.
    var nodes = document.querySelectorAll('h1, h2, h3, .widget__title, .graph__title, .chart__title');
    nodes.forEach(function (node) {
      if (!node) return;
      var text = (node.textContent || '').trim();
      if (!text) return;
      if (text.toUpperCase().indexOf('ALLURE REPORT') !== 0) return;
      node.textContent = text.replace(/ALLURE REPORT/i, 'API Execution Report');
    });
  }

  function keepOverviewSummaryAndSuitesOnly() {
    var titles = document.querySelectorAll('.widget__title, .graph__title, .chart__title, h2');
    titles.forEach(function (title) {
      var text = (title.textContent || '').trim().toUpperCase();
      if (!text) return;
      var keep = text.indexOf('ALLURE REPORT') >= 0 || text.indexOf('API EXECUTION REPORT') >= 0 || text.indexOf('SUITES') >= 0;
      if (keep) return;
      var block = title.closest('.widget, .chart, .dashboard__widget, .pane, .col, section');
      if (block && block.parentElement) {
        block.style.display = 'none';
      }
    });
  }

  function injectQuickLinks() {
    var hash = window.location.hash || '';
    if (hash && hash !== '#' && hash !== '#overview') return;
    var root = document.querySelector('.app__content, .layout__content, .dashboard, main, .main');
    if (!root) return;
    if (document.getElementById('qa-quick-links')) return;

    var box = document.createElement('div');
    box.id = 'qa-quick-links';
    box.style.margin = '12px 0';
    box.style.padding = '12px 16px';
    box.style.border = '1px solid #e5e5e5';
    box.style.borderRadius = '8px';
    box.style.background = '#fff';
    box.style.display = 'flex';
    box.style.alignItems = 'center';
    box.style.gap = '12px';
    box.style.flexWrap = 'wrap';

    var title = document.createElement('strong');
    title.textContent = 'Quick Links';
    title.style.marginRight = '8px';
    box.appendChild(title);

    function addLink(label, url) {
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = label;
      a.style.padding = '6px 10px';
      a.style.borderRadius = '6px';
      a.style.border = '1px solid #d0d0d0';
      a.style.textDecoration = 'none';
      a.style.color = '#1f4d9a';
      box.appendChild(a);
    }
    addLink('Postman Workspace', POSTMAN_URL);
    addLink('TestNG Repository', TESTNG_URL);

    var firstWidget = root.querySelector('.widget, section, .dashboard__widget, .col');
    if (firstWidget && firstWidget.parentElement) {
      firstWidget.parentElement.insertBefore(box, firstWidget);
    } else {
      root.insertBefore(box, root.firstChild);
    }
  }

  function apply() {
    hideModules();
    customizeBrand();
    replaceOverviewTitle();
    keepOverviewSummaryAndSuitesOnly();
    injectQuickLinks();
  }

  apply();
  var observer = new MutationObserver(function () { apply(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('hashchange', apply);
})();
/* allure-ui-customization:end */
</script>

</body>
</html>
