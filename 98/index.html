<!DOCTYPE html>
<html dir="ltr" lang="en">
<head>
    <meta charset="utf-8">
    <title>Allure Report</title>
    <link rel="favicon" href="favicon.ico">
    <link rel="stylesheet" type="text/css" href="styles.css">
    <link rel="stylesheet" type="text/css" href="plugin/screen-diff/styles.css">
</head>
<body>
    <div id="alert"></div>
    <div id="content">
        <span class="spinner">
            <span class="spinner__circle"></span>
        </span>
    </div>
    <div id="popup"></div>
    <script src="app.js"></script>
    <script src="plugin/behaviors/index.js"></script>
    <script src="plugin/screen-diff/index.js"></script>
    <script src="plugin/packages/index.js"></script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-FVWC4GKEYS"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-FVWC4GKEYS');
        gtag('allureVersion', 'dev')
        gtag('reportUuid', '2a668f7b-ccfd-459d-80e9-41cc10007761')
    </script>

<script>
/* allure-ui-customization */
(function () {
  var POSTMAN_URL = 'https://qa-62.postman.co/workspace/ff37cf16-0011-4920-87e2-1e4203967ab5/overview?sideView=agentMode';
  var TESTNG_URL = 'https://github.com/visable-dev/v-china-autotest';
  var VISABLE_ICON_URL = 'https://www.visable.com/favicon.ico';

  function hideModules() {
    var hiddenRoutes = ['#categories', '#graphs', '#timeline', '#behaviors', '#packages'];
    var hiddenNames = ['categories', 'graphs', 'timeline', 'behaviors', 'packages'];
    var links = document.querySelectorAll('a[href]');
    links.forEach(function (a) {
      var href = a.getAttribute('href') || '';
      var text = (a.textContent || '').trim().toLowerCase();
      var routeHit = hiddenRoutes.indexOf(href) >= 0;
      var nameHit = hiddenNames.some(function (name) { return text === name || text.indexOf(name) >= 0; });
      if (!routeHit && !nameHit) return;
      var row = a.closest('li') || a.parentElement;
      if (row) row.style.display = 'none';
    });
  }

  function customizeBrand() {
    var titleNodes = Array.from(document.querySelectorAll('*')).filter(function (el) {
      var text = (el.textContent || '').trim();
      return text === 'Allure';
    });
    titleNodes.forEach(function (node) {
      if (!node || !node.parentElement) return;
      node.textContent = 'QA';
      var parent = node.parentElement;
      var img = parent.querySelector('img[data-visable-logo="true"]');
      if (!img) {
        img = document.createElement('img');
        img.setAttribute('data-visable-logo', 'true');
        img.src = VISABLE_ICON_URL;
        img.alt = 'visable';
        img.style.width = '40px';
        img.style.height = '40px';
        img.style.objectFit = 'contain';
        img.style.marginRight = '10px';
        parent.insertBefore(img, parent.firstChild);
      }
    });
  }

  function replaceOverviewTitle() {
    var titleNodes = document.querySelectorAll('.widget__title, .graph__title, .chart__title, h2, h1');
    titleNodes.forEach(function (node) {
      var text = (node.textContent || '').trim();
      if (text.toUpperCase().indexOf('ALLURE REPORT') === 0) {
        node.textContent = text.replace(/ALLURE REPORT/i, 'API Execution Report');
      }
    });
  }

  function keepOverviewSummaryAndSuitesOnly() {
    var titles = document.querySelectorAll('.widget__title, .graph__title, .chart__title, h2');
    titles.forEach(function (title) {
      var text = (title.textContent || '').trim().toUpperCase();
      if (!text) return;
      var keep = text.indexOf('ALLURE REPORT') >= 0 || text.indexOf('SUITES') >= 0;
      if (keep) return;
      var block = title.closest('.widget, .chart, .dashboard__widget, .pane, .col, section');
      if (block && block.parentElement) {
        block.style.display = 'none';
      }
    });
  }

  function injectQuickLinks() {
    if (window.location.hash && window.location.hash !== '#overview') return;
    var root = document.querySelector('.dashboard, .app__content, .layout__content, main');
    if (!root) return;
    if (document.getElementById('qa-quick-links')) return;

    var box = document.createElement('div');
    box.id = 'qa-quick-links';
    box.style.margin = '12px 0';
    box.style.padding = '12px 16px';
    box.style.border = '1px solid #e5e5e5';
    box.style.borderRadius = '8px';
    box.style.background = '#fff';
    box.style.display = 'flex';
    box.style.alignItems = 'center';
    box.style.gap = '12px';
    box.style.flexWrap = 'wrap';

    var title = document.createElement('strong');
    title.textContent = 'Quick Links';
    title.style.marginRight = '8px';
    box.appendChild(title);

    function addLink(label, url) {
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = label;
      a.style.padding = '6px 10px';
      a.style.borderRadius = '6px';
      a.style.border = '1px solid #d0d0d0';
      a.style.textDecoration = 'none';
      a.style.color = '#1f4d9a';
      box.appendChild(a);
    }
    addLink('Postman Workspace', POSTMAN_URL);
    addLink('TestNG Repository', TESTNG_URL);

    root.insertBefore(box, root.firstChild);
  }

  function apply() {
    hideModules();
    customizeBrand();
    replaceOverviewTitle();
    keepOverviewSummaryAndSuitesOnly();
    injectQuickLinks();
  }

  apply();
  var observer = new MutationObserver(function () { apply(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('hashchange', apply);
})();
</script>

</body>
</html>
