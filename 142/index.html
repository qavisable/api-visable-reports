  function ensureBrandStyleOverride() {
    var styleId = 'qa-brand-style-override';
    if (document.getElementById(styleId)) return;
    var css = ''
      + '.side-nav__head::before,.side-nav__head::after,.side-nav__brand::after{content:none!important;display:none!important;}'
      + '.side-nav__head{display:flex!important;justify-content:center!important;align-items:center!important;padding-left:0!important;padding-right:0!important;}'
      + '.side-nav__brand{background-image:none!important;}'
      + '.side-nav__brand{display:flex!important;flex-direction:column!important;align-items:center!important;justify-content:center!important;gap:6px!important;overflow:visible!important;max-width:none!important;width:100%!important;box-sizing:border-box!important;text-align:center!important;padding:0 0 6px 0!important;margin:0 auto!important;}'
      + '.side-nav__brand::before{'
      + 'content:"";display:inline-block!important;flex:0 0 auto;width:124px;height:40px;margin:0 auto!important;'
      + 'background-image:url("' + VISABLE_LOGO_DATA_URI + '");'
      + 'background-size:contain;background-repeat:no-repeat;background-position:center;'
      + '}'
      + '.side-nav__head [class*="icon"],.side-nav__brand [class*="icon"]{display:none!important;}'
      + '.side-nav__brand > *:not(.side-nav__brand-text){display:none!important;}'
      + '.side-nav__brand-text::before{content:none!important;display:none!important;}'
      + '.side-nav__brand-text{'
      + 'color:#fff!important;display:block!important;line-height:1!important;'
      + 'margin:0!important;font-size:22px!important;font-weight:700!important;'
      + 'position:static!important;left:auto!important;right:auto!important;'
      + 'top:auto!important;bottom:auto!important;transform:none!important;'
      + 'max-width:none!important;overflow:visible!important;white-space:nowrap!important;text-align:center!important;'
      + '}';
    var style = document.createElement('style');
    style.id = styleId;
    style.type = 'text/css';
    style.appendChild(document.createTextNode(css));
    document.head.appendChild(style);
  }

  function hideModules() {
    var hiddenRoutes = ['#categories', '#graphs', '#timeline', '#behaviors', '#packages'];
    var hiddenNames = ['categories', 'graphs', 'timeline', 'behaviors', 'packages'];
    var navRoot = document.querySelector('aside, .side-nav, .sidebar') || document;
    var links = navRoot.querySelectorAll('a[href]');
    links.forEach(function (a) {
      var href = a.getAttribute('href') || '';
      var text = (a.textContent || '').trim().toLowerCase();
      var routeHit = hiddenRoutes.indexOf(href) >= 0;
      var nameHit = hiddenNames.some(function (name) { return text === name || text.indexOf(name) >= 0; });
      if (!routeHit && !nameHit) return;
      var row = a.closest('li') || a.parentElement;
      if (row) row.style.display = 'none';
    });

    // Fallback for nav items rendered without href; keep scope in sidebar only.
    var maybeNavItems = navRoot.querySelectorAll('li, a, span');
    maybeNavItems.forEach(function (el) {
      var txt = (el.textContent || '').trim().toLowerCase();
      if (!txt) return;
      if (!hiddenNames.some(function (name) { return txt === name; })) return;
      var row = el.closest('li') || el.parentElement;
      if (row) row.style.display = 'none';
    });
  }

  function customizeBrand() {
    var brandLink = document.querySelector('.side-nav__brand');
    if (!brandLink) return;
    var textNode = brandLink.querySelector('.side-nav__brand-text');
    if (!textNode) return;

    ensureBrandStyleOverride();
    textNode.textContent = 'Visable QA';
  }

  function replaceOverviewTitle() {
    var nodes = document.querySelectorAll('h1, h2, h3, .widget__title, .graph__title, .chart__title');
    nodes.forEach(function (node) {
      if (!node) return;
      var child = node.firstChild;
      while (child) {
        if (child.nodeType === Node.TEXT_NODE) {
          var text = child.nodeValue || '';
          if (/ALLURE REPORT/i.test(text)) {
            child.nodeValue = text.replace(/ALLURE REPORT/i, 'API Execution Report');
            return;
          }
        }
        child = child.nextSibling;
      }
    });
  }

  function keepOverviewSummaryAndSuitesOnly() {
    var titles = document.querySelectorAll('.widget__title, .graph__title, .chart__title');
    titles.forEach(function (title) {
      var text = (title.textContent || '').trim().toUpperCase();
      if (!text) return;
      var keep = text.indexOf('ALLURE REPORT') >= 0 || text.indexOf('API EXECUTION REPORT') >= 0 || text.indexOf('SUITES') >= 0;
      if (keep) return;
      var block = title.closest('.widget, .chart, .dashboard__widget, .pane, .col, section');
      if (block && block.parentElement) {
        block.style.display = 'none';
      }
    });
  }

  function injectQuickLinks() {
    var hash = window.location.hash || '';
    if (hash && hash !== '#' && hash !== '#overview') return;
    var root = document.querySelector('.app__content, .layout__content, .dashboard, main, .main');
    if (!root) return;
    if (document.getElementById('qa-quick-links')) return;

    var box = document.createElement('div');
    box.id = 'qa-quick-links';
    box.style.margin = '12px 0';
    box.style.padding = '12px 16px';
    box.style.border = '1px solid #e5e5e5';
    box.style.borderRadius = '8px';
    box.style.background = '#fff';
    box.style.display = 'flex';
    box.style.alignItems = 'center';
    box.style.gap = '12px';
    box.style.flexWrap = 'wrap';

    var title = document.createElement('strong');
    title.textContent = 'Quick Links';
    title.style.marginRight = '8px';
    box.appendChild(title);

    function addLink(label, url) {
      var a = document.createElement('a');
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = label;
      a.style.padding = '6px 10px';
      a.style.borderRadius = '6px';
      a.style.border = '1px solid #d0d0d0';
      a.style.textDecoration = 'none';
      a.style.color = '#1f4d9a';
      box.appendChild(a);
    }
    addLink('Postman Workspace', POSTMAN_URL);
    addLink('TestNG Repository', TESTNG_URL);

    var firstWidget = root.querySelector('.widget, section, .dashboard__widget, .col');
    if (firstWidget && firstWidget.parentElement) {
      firstWidget.parentElement.insertBefore(box, firstWidget);
    } else {
      root.insertBefore(box, root.firstChild);
    }
  }

  function apply() {
    hideModules();
    customizeBrand();
    replaceOverviewTitle();
    keepOverviewSummaryAndSuitesOnly();
    injectQuickLinks();
  }

  function safeApply() {
    try {
      apply();
    } catch (e) {
      console.warn('allure customization skipped due to runtime error', e);
    }
  }

  var applyScheduled = false;
  function scheduleApply() {
    if (applyScheduled) return;
    applyScheduled = true;
    window.requestAnimationFrame(function () {
      applyScheduled = false;
      safeApply();
    });
  }

  safeApply();
  var observer = new MutationObserver(function () { scheduleApply(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  window.addEventListener('hashchange', scheduleApply);
})();
/* allure-ui-customization:end */
</script>
